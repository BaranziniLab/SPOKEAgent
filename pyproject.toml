[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spokeagent"
version = "0.4.1"
description = "An MCP server for querying the SPOKE biomedical knowledge graph for rapid biomedical knowledge inference"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Wanjun Gu", email = "wanjun.gu@ucsf.edu"},
    {name = "Gianmarco Bellucci", email = "gianmarco.bellucci@ucsf.edu"}
]
maintainers = [
    {name = "Wanjun Gu", email = "wanjun.gu@ucsf.edu"},
    {name = "Gianmarco Bellucci", email = "gianmarco.bellucci@ucsf.edu"}
]
keywords = [
    "mcp",
    "biomedical",
    "knowledge-graph",
    "spoke",
    "neo4j",
    "healthcare",
    "bioinformatics"
]
dependencies = [
    "fastmcp>=4.0,<5.0",
    "mcp>=2.0,<3.0",
    "neo4j>=5.28.2",
    "pydantic>=2.11.7",
]
requires-python = ">=3.11"

[project.scripts]
spokeagent = "spokeagent.cli:main"

[tool.uv]
# cryptography >=49 dropped x86_64 macOS wheels (2026-06-12), forcing a
# from-source Rust build on Intel Macs. Cap it to <49 there so Intel users get
# a prebuilt wheel; arm64/Linux/Windows are unaffected.
constraint-dependencies = [
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
